[project]
name = "dcase2026-task6-baseline"
version = "0.1.0"
description = "QD-DETR-based baseline for DCASE 2026 task 6"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "easydict>=1.13",
    "gitpython>=3.1.40",
    "huggingface-hub>=1.8.0",
    "mlflow>=2.10.0,<3.0.0",
    "numpy<2.0",
    "packaging>=24.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.6.1",
    "torch==2.1.0",
    "torchaudio==2.1.0",
    "torchvision==0.16.0",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118" }]
torchvision = [{ index = "pytorch-cu118" }]
torchaudio = [{ index = "pytorch-cu118" }]
